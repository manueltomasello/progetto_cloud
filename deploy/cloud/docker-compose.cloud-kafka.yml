# Override per la demo ibrida: i servizi locali che usano Kafka si collegano a
# un broker gestito (SASL_SSL) invece che al Kafka locale.
# Uso:
#   docker compose -f docker-compose.yml -f deploy/cloud/docker-compose.cloud-kafka.yml up --build
# Richiede un file .env con KAFKA_BOOTSTRAP_SERVERS, KAFKA_API_KEY, KAFKA_API_SECRET.
services:
  manutenzioni-service:
    environment:
      SPRING_PROFILES_ACTIVE: cloud
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_API_KEY: ${KAFKA_API_KEY}
      KAFKA_API_SECRET: ${KAFKA_API_SECRET}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-SCRAM-SHA-256}
  fatturazione-service:
    environment:
      SPRING_PROFILES_ACTIVE: cloud
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_API_KEY: ${KAFKA_API_KEY}
      KAFKA_API_SECRET: ${KAFKA_API_SECRET}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-SCRAM-SHA-256}
