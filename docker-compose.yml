version: "3.9"

services:

  # ─── Frontend Vue (nginx) ────────────────────────
  frontend:
    build:
      context: "."
      dockerfile: "frontend/Dockerfile"
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  # ─── Backend Node/Express ────────────────────────
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DB_SERVER=sqlserver
      - DB_PORT=1433
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - OPEN_AI_KEY=${OPEN_AI_KEY}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

  # ─── SQL Server 2022 ─────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${DB_PASSWORD}
      - MSSQL_PID=Express
    ports:
      - "1433:1433"       # utile per connettersi con SSMS durante lo sviluppo
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./database:/docker-entrypoint-initdb.d   # script SQL di init
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost",
             "-U", "sa", "-P", "${DB_PASSWORD}", "-Q", "SELECT 1", "-No"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  sqlserver_data:
