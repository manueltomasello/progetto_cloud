server:
  port: 8082

spring:
  application:
    name: anagrafiche-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/anagrafiche_db}
    username: ${DB_USER:gestionale}
    password: ${DB_PASSWORD:gestionale}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
